name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ocpp-sim

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev pkg-config

      - name: Set up the Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: ocpp-sim
          toolchains: arm-zephyr-eabi

      - name: Build the simulator
        working-directory: ocpp-sim
        run: west twister -T app -v --inline-logs --integration

      - name: Run the unit tests
        working-directory: ocpp-sim
        run: west twister -T tests -v --inline-logs --integration
