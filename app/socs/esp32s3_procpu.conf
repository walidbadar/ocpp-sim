# ESP32-S3 boards with PSRAM: Wi-Fi in place of the host's sockets, no shell.

# The console carries the log only; the display does what "sim" would
CONFIG_SHELL=n

# --- Wi-Fi ----------------------------------------------------------------
# wifi.c joins the network at every start: one kept on flash by the
# wifi_credentials library, or the one given to the build with
#   CONFIG_WIFI_CREDENTIALS_STATIC=y
#   CONFIG_WIFI_CREDENTIALS_STATIC_SSID, CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD
CONFIG_WIFI=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
# The ESP32 driver starts up in the context of the connect request, which
# runs on the system work queue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
# cp.c waits for an address before it looks up the backend
CONFIG_NET_CONNECTION_MANAGER=y
# No clock on the board: the OCPP timestamps come from SNTP
CONFIG_SNTP=y

# --- Stacks ---------------------------------------------------------------
# The log thread overflows its default of 1 KB here, which hangs the system
# without a message
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024

# --- Memory ---------------------------------------------------------------
# LVGL and Wi-Fi do not fit into the internal RAM together: the Wi-Fi and
# network buffers and the LVGL memory pool go to the PSRAM (the SoC linker
# script places .lvgl_heap there). The render buffer stays in internal RAM,
# the display's SPI driver sends it with DMA.
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y
# The 128 KB of prj.conf run out while TinyTTF renders the first screen: an
# assertion in its rasteriser then stops the system
CONFIG_LV_Z_MEM_POOL_SIZE=1048576

# TinyTTF computes in floating point on the main thread: keep its registers
# across switches to other threads that use the FPU
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
