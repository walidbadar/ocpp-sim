# --- Kernel ---------------------------------------------------------------------
# The main thread runs LVGL; a lower priority than the OCPP threads (7), the
# network stack and the shell.
CONFIG_MAIN_THREAD_PRIORITY=10
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# The OCPP library logs through the network log
CONFIG_NET_LOG=y
CONFIG_REBOOT=y

# --- OCPP 1.6J charge point (Zephyr subsys/net/lib/ocpp) -----------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_ZVFS_POLL_MAX=8
CONFIG_HTTP_CLIENT=y
CONFIG_WEBSOCKET_CLIENT=y
CONFIG_JSON_LIBRARY=y
CONFIG_OCPP=y

# --- Backend URL, identity and identifiers on flash --------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- "sim" commands on the console -------------------------------------------
CONFIG_SHELL=y
# The log goes to the console's own backend, from the first line on; through
# the shell everything logged before the shell runs would be lost.
CONFIG_SHELL_LOG_BACKEND=n

# --- Display and touch (LVGL) --------------------------------------------------
CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_LVGL=y
CONFIG_LV_Z_POINTER_INPUT=y
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=64
CONFIG_LV_Z_MEM_POOL_SIZE=131072
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_SWITCH=y
CONFIG_LV_USE_TEXTAREA=y
CONFIG_LV_USE_KEYBOARD=y
CONFIG_LV_USE_BUTTONMATRIX=y
CONFIG_LV_USE_QRCODE=y
CONFIG_LV_USE_FLEX=y
# Headlines and numbers: Montserrat Bold (app/fonts) rendered by TinyTTF at
# the sizes the display calls for. Text and icons: the built-in fonts.
CONFIG_LV_USE_TINY_TTF=y
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y
