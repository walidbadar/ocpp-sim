#
# native_sim/native/64: the SDL window is the display, the mouse the touch
# screen, the terminal the console ("sim" commands) and the sockets are the
# host's, so the simulator reaches a central system on this machine or the
# network without any interface set-up.

CONFIG_NET_DRIVERS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

CONFIG_LV_COLOR_DEPTH_32=y
# Room for lv_snapshot_take() of the whole screen (--shot)
CONFIG_LV_USE_SNAPSHOT=y
CONFIG_LV_Z_MEM_POOL_SIZE=4194304

# The console on the terminal that started the simulator
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

# "Restart" starts the executable again, with the same command line
CONFIG_NATIVE_SIM_REBOOT=y
